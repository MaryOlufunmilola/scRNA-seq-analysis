[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors and warnings plus pyflakes (unused imports, undefined names).
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length is already covered by line-length above; don't double-flag
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401"]  # notebooks import things for display
